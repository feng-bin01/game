name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign APK with Debug Key
        run: |
          # Generate debug keystore
          keytool -genkey -v -keystore $HOME/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          
          # Sign the APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore $HOME/debug.keystore -storepass android \
            -keypass android \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            androiddebugkey
          
          # Align
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/TapClicker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TapClicker-APK
          path: app/build/outputs/apk/release/TapClicker.apk
